<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - DocuForge AI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        h1, h2, h3 { color: #2c3e50; }
        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h2 { margin-top: 30px; border-left: 4px solid #3498db; padding-left: 10px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .footer { margin-top: 50px; font-size: 12px; color: #7f8c8d; text-align: center; }
        .diagram { margin: 20px 0; text-align: center; }
        .conflict, .risk { background-color: #fef9e7; padding: 10px; border-left: 4px solid #e67e22; margin: 10px 0; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .must { background-color: #e74c3c; color: white; }
        .should { background-color: #f39c12; color: white; }
        .could { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    <p><strong>Project:</strong> {{ project_name }} ({{ project_id }})</p>
    <p><strong>Generated:</strong> {{ date }}</p>
    <hr>
    {% block content %}{% endblock %}
    <div class="footer">
        Generated by DocuForge AI – Intelligent Requirements Engineering Platform
    </div>
</body>
</html>
